<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Dashboard</title>
    <meta
      name="description"
      content="Modern weather dashboard powered by the Open-Meteo API"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">☀️</span>
          <div>
            <p class="eyebrow">Forecast</p>
            <h1>Weather Dashboard</h1>
          </div>
        </div>

        <form id="search-form" class="search-form" aria-label="Search for a city">
          <input
            id="city-input"
            type="text"
            placeholder="Search city, e.g. London"
            autocomplete="off"
          />
          <button type="submit">Search</button>
        </form>
      </header>

      <main class="dashboard">
        <section class="hero card">
          <div class="hero-main">
            <p id="location-name" class="location-name">Loading...</p>
            <h2 id="current-temp" class="current-temp">--°</h2>
            <p id="weather-summary" class="weather-summary">Fetching conditions...</p>
          </div>

          <div class="hero-meta">
            <div>
              <span>Feels like</span>
              <strong id="feels-like">--°</strong>
            </div>
            <div>
              <span>Humidity</span>
              <strong id="humidity">--%</strong>
            </div>
            <div>
              <span>Wind</span>
              <strong id="wind-speed">-- km/h</strong>
            </div>
          </div>
        </section>

        <section class="stats-grid">
          <article class="card metric">
            <span class="label">High</span>
            <strong id="high-temp">--°</strong>
          </article>
          <article class="card metric">
            <span class="label">Low</span>
            <strong id="low-temp">--°</strong>
          </article>
          <article class="card metric">
            <span class="label">Sunrise</span>
            <strong id="sunrise">--:--</strong>
          </article>
          <article class="card metric">
            <span class="label">Sunset</span>
            <strong id="sunset">--:--</strong>
          </article>
        </section>

        <section class="card">
          <div class="section-header">
            <h3>Hourly forecast</h3>
          </div>
          <div id="hourly-forecast" class="forecast-row" aria-live="polite"></div>
        </section>

        <section class="card">
          <div class="section-header">
            <h3>5-day outlook</h3>
          </div>
          <div id="daily-forecast" class="daily-list" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <template id="hourly-item-template">
      <div class="hour-card">
        <span class="time"></span>
        <span class="symbol"></span>
        <strong class="temp"></strong>
      </div>
    </template>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
